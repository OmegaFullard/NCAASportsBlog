<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Featured player highlights and game analysis" />
    <title>Featured Story - NCAA College Sports</title>

    <!-- Lightweight responsive styling -->
    <style>
        :root {
            --bg: #0f1724;
            --card: #e6eef8;
            --muted: #9aa7bd;
            --accent: #ff6b35;
            --max-width: 900px;
            --radius: 10px;
            font-size: 16px;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Inter,Segoe UI,system-ui,Helvetica,Arial,sans-serif;
            background: linear-gradient(180deg, rgba(15,23,36,0.85), rgba(15,23,36,0.85)), url('/images/ncaateamlogosbg.jpg') center/cover no-repeat;
            color: #e6eef8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            padding: 32px;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        article {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius);
            padding: 32px;
        }

        .meta {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 16px;
        }

        h1 {
            color: #e6eef8;
            font-size: 32px;
            margin: 0 0 24px 0;
        }

        .lead {
            font-size: 18px;
            color: #9aa7bd;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .content {
            color: #e6eef8;
        }

        .content p {
            margin-bottom: 16px;
        }

        .content h2 {
            color: #e6eef8;
            font-size: 24px;
            margin: 32px 0 16px 0;
        }

        .highlight-box {
            background: rgba(255,107,53,0.1);
            border-left: 4px solid var(--accent);
            padding: 16px;
            margin: 24px 0;
            border-radius: 4px;
        }

        .stats-table {
            width: 100%;
            margin: 24px 0;
            border-collapse: collapse;
        }

        .stats-table th {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .stats-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        footer {
            margin-top: 48px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width:640px) {
            body {
                padding: 18px;
            }

            article {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>

        <article id="featured-article">
            <div class="meta">Featured · February 26, 2026 · By Staff Writer</div>
            <h1 id="article-title">Loading...</h1>
            <p class="lead" id="article-lead">Loading content...</p>
            
            <div class="content" id="article-content">
                <!-- Content will be loaded dynamically -->
            </div>
        </article>

        <footer>
            <div>© <span id="year"></span> College Sports Blog · Built for fans and student-athletes.</div>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Get article ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id') || '1';

        // Sample featured articles content
        const articles = {
            '1': {
                title: 'Power Rankings',
                meta: 'Featured · February 26, 2026 · By Staff Writer',
                lead: 'Is Duke truly the top team to beat?',
                content: `
                    <h2>Rise to the tap</h2>
                    <p>Duke leap to being a top contender for the title comes just in time for March Madness.</p>

                    <div class="highlight-box">
                        <strong>Key Stat:Duke topples Notre Dame by nearly 44 points, which handed Notre Dame their worst home loss since 1898</strong> .
                    </div>

                    <h2>Player Performances</h2>
                    <p>Duke National Player of the Year favorite "Cameron Boozer" leads the charge towards defeating top tier opponents like North Carolina. He is averaging 22.7 ppg wih 10 rebounds and boosts a 58% field goal percentage</p>

                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>First 5 Games</th>
                                <th>Last 5 Games</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Points Per Possession</td>
                                <td>1.18</td>
                                <td>1.26+</td>
                            </tr>
                            <tr>
                                <td>3-Pointers Made (avg)</td>
                                <td>5.6</td>
                                <td>7.4</td>
                            </tr>
                            <tr>
                                <td>Field Goal %</td>
                                <td>52.5%</td>
                                <td>60%</td>
                            </tr>
                        </tbody>
                    </table>

                    <h2>Looking Ahead</h2>
                    <p>Duke face strong opponents UVA ranked #11 and rival UNC ranked 18 over the next few weeks. These games will be a test to their ability to overcome challenges of being ranked #1 in the country</p>

                    <p>Fans can expect Boozer to be a intergral part of the team continued success. Look forward to see if they can remain number one after a few tough matchups.</p>
                `
            },
            '2': {
                title: 'UCF upset win against BYU',
                meta: 'Featured · February 25, 2026 · By Staff Writer',
                lead: 'Themus Fulks had 24 points and 11 assists, Jordan Burks also scored a career high of 24 points.',
                content: `
                    <h2>Keys to Victory</h2>
                    <p>UCF drained 14 3-pointers during their upsetting victory of the 19th ranked BYU</p>

                    <div class="highlight-box">
                        <strong>Explosive Second Half:</strong> Michigan put up 54 points in the final 18:48, turning a potential upset into another blowout victory.
                    </div>

                    <h2>Offensive Highlights</h2>
                    <p>Aj Dybansta led BYU with 29 poins and 8 rebounds, his 21st game scoring at least 20 points. His scoring was unable to keep up with the the Knight's 14-of-24 three point shooting.</p>

                    <h2>Player Spotlight</h2>
                    <p>Senior Forward Jamichael Stillwell scored 12 points with with a 66.7 fg %. His biggest contributions came from his 12 rebounds and 6 assists.</p>

                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Half</th>
                                <th>Points</th>
                                <th>Field Goal %</th>
                                <th>Turnovers</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>First Half</td>
                                <td>52</td>
                                <td>49.6</td>
                                <td>9</td>
                            </tr>
                            <tr>
                                <td>Second Half</td>
                                <td>45</td>
                                <td>56.3%</td>
                                <td>6</td>
                            </tr>
                        </tbody>
                    </table>

                    <h2>Next Challenge</h2>
                    <p>UCF hosts Baylor on Saturday and hopes to continue their win streak.</p>

                    <p>This game sets the pace for the remaining games before March Madness game play.</p>
                `
            }
        };

        // Load the article based on ID
        const article = articles[articleId] || articles['1'];
        
        document.getElementById('article-title').textContent = article.title;
        document.querySelector('.meta').textContent = article.meta;
        document.getElementById('article-lead').textContent = article.lead;
        document.getElementById('article-content').innerHTML = article.content;

        // Update page title
        document.title = `${article.title} - NCAA College Sports`;
    </script>
</body>
</html>
